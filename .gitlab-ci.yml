# Mirrors .github/workflows/scan-service-ci.yml's merge gate on GitLab, where
# merges to this repo actually happen (the GitHub mirror is a CI convenience
# for the iOS/macOS build only — Actions results there block nothing here).

stages:
  - test

scan-service-net:
  stage: test
  image: php:8.3-cli
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends libsqlite3-dev libpng-dev curl
    - docker-php-ext-install pdo_sqlite gd
  script:
    - cd scan-service
    - php tests/adapter_test.php
    - php tests/repository_test.php
    - php tests/export_renderer_test.php
    - php tests/concurrency_test.php
    - rm -f data/scan_service.sqlite
    - php -d post_max_size=16M -d display_errors=0 -S 127.0.0.1:8089 public/index.php &
    - |
      for i in $(seq 1 20); do
        curl -sf http://127.0.0.1:8089/health > /dev/null && break
        sleep 0.5
      done
    - php net/verify_capture_geometry.php http://127.0.0.1:8089
    - php net/verify_multiroom_and_attachments.php http://127.0.0.1:8089
    - php net/verify_exports.php http://127.0.0.1:8089
    - php net/verify_acl.php http://127.0.0.1:8089
    - php net/verify_coverage.php http://127.0.0.1:8089
    - php net/verify_security_fixes.php http://127.0.0.1:8089
    - php net/verify_error_messages.php http://127.0.0.1:8089
    - php net/verify_enterprise_hardening.php http://127.0.0.1:8089
    - rm -f data/scan_service.sqlite
    - php -d post_max_size=16M -d display_errors=0 -S 127.0.0.1:9499 public/index.php &
    - |
      for i in $(seq 1 20); do
        curl -sf http://127.0.0.1:9499/health > /dev/null && break
        sleep 0.5
      done
    - php net/verify_post_body_read_rate_limit.php http://127.0.0.1:9499
  rules:
    - changes:
        - scan-service/**/*
        - .gitlab-ci.yml
