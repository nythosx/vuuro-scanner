# Mirrors .github/workflows/scan-service-ci.yml's merge gate on GitLab, where
# merges to this repo actually happen (the GitHub mirror is a CI convenience
# for the iOS/macOS build only — Actions results there block nothing here).
#
# Runs on a project-registered shell-executor runner (tag: windows-shell) —
# no shared-runner CI/CD minutes required. `image:` is ignored by a shell
# executor; it's left here as the documented target if this ever moves to a
# docker-executor runner instead. Script is PowerShell, not bash: GitLab's
# own Windows shell-executor guidance is to use powershell/pwsh, not bash —
# Git-for-Windows' MSYS2 bash.exe doesn't behave reliably when GitLab Runner
# launches it detached/without a console (confirmed while wiring this up: it
# returns exit 0 and drops all output even for a trivial `exit 7`). A shell
# executor uses whatever's already on the runner host, so PHP with
# pdo_sqlite/gd/curl/mbstring must be pre-installed there (see the runner
# host's own setup, not this file).
#
# Every "this might not exist yet" cleanup below is written to never raise a
# PowerShell error in the first place (Test-Path / HasExited / an unfiltered
# Get-Process piped through Where-Object) rather than raising one and trying
# to catch it: GitLab's PowerShell shell treats $? as failed for the whole
# line even when a try/catch around the failing call swallowed the
# exception, which silently aborted step_script here twice in a row with
# zero visible error (first on a bare Remove-Item on a not-yet-existing
# sqlite file, then again on the same line wrapped in try/catch).

stages:
  - test

scan-service-net:
  stage: test
  image: php:8.3-cli
  tags:
    - windows-shell
  script:
    - cd scan-service
    - php tests/adapter_test.php
    - php tests/repository_test.php
    - php tests/export_renderer_test.php
    - php tests/concurrency_test.php
    - if (Test-Path data\scan_service.sqlite) { Remove-Item -Force data\scan_service.sqlite }
    - $env:SCAN_SERVICE_RATE_LIMIT_CREATE_SESSION_MAX = "100"
    - $server1 = Start-Process -FilePath php -ArgumentList "-d","post_max_size=30M","-d","upload_max_filesize=26M","-d","display_errors=0","-S","127.0.0.1:8089","public/index.php" -WindowStyle Hidden -PassThru
    - |
      for ($i = 0; $i -lt 20; $i++) {
        try {
          $r = Invoke-WebRequest -Uri http://127.0.0.1:8089/health -UseBasicParsing -TimeoutSec 1
          if ($r.StatusCode -eq 200) { break }
        } catch {}
        Start-Sleep -Milliseconds 500
      }
    - php net/verify_capture_geometry.php http://127.0.0.1:8089
    - php net/verify_multiroom_and_attachments.php http://127.0.0.1:8089
    - php net/verify_multiroom_fusion.php http://127.0.0.1:8089
    - php net/verify_exports.php http://127.0.0.1:8089
    - php net/verify_acl.php http://127.0.0.1:8089
    - php net/verify_coverage.php http://127.0.0.1:8089
    - php net/verify_openings_and_objects.php http://127.0.0.1:8089
    - php net/verify_security_fixes.php http://127.0.0.1:8089
    - php net/verify_error_messages.php http://127.0.0.1:8089
    - php net/verify_session_delete.php http://127.0.0.1:8089
    - php net/verify_enterprise_hardening.php http://127.0.0.1:8089
    - if (-not $server1.HasExited) { Stop-Process -Id $server1.Id -Force }
    - if (Test-Path data\scan_service.sqlite) { Remove-Item -Force data\scan_service.sqlite }
    - $server2 = Start-Process -FilePath php -ArgumentList "-d","post_max_size=30M","-d","upload_max_filesize=26M","-d","display_errors=0","-S","127.0.0.1:9499","public/index.php" -WindowStyle Hidden -PassThru
    - |
      for ($i = 0; $i -lt 20; $i++) {
        try {
          $r = Invoke-WebRequest -Uri http://127.0.0.1:9499/health -UseBasicParsing -TimeoutSec 1
          if ($r.StatusCode -eq 200) { break }
        } catch {}
        Start-Sleep -Milliseconds 500
      }
    - php net/verify_post_body_read_rate_limit.php http://127.0.0.1:9499
    - if (-not $server2.HasExited) { Stop-Process -Id $server2.Id -Force }
  after_script:
    - Get-Process | Where-Object { $_.ProcessName -eq 'php' } | ForEach-Object { Stop-Process -Id $_.Id -Force }
  rules:
    - changes:
        - scan-service/**/*
        - .gitlab-ci.yml

# scan-service-net above never touches the Dockerfile at all (it runs PHP
# straight on the runner host), so it stayed green through a whole build of
# ba2f729's Dockerfile being broken (--with-jpeg with no libjpeg-dev,
# pdo_sqlite with no libsqlite3-dev - Mark found it testing on his Mac,
# 2026-09-01, since he runs the Scan Service via Docker there). This job
# closes that gap: a real `docker build` + `docker run` + /health check on
# this same runner host, via Docker-in-WSL2 (Ubuntu, installed as
# docker.io, run as root to avoid needing an interactive sudo password on a
# non-interactive runner). Without this, "the Dockerfile builds" is once
# again a claim nothing re-checks on the next change to it.
scan-service-docker-build:
  stage: test
  tags:
    - windows-shell
  script:
    - $projectRoot = (Get-Location).Path
    - $wslRoot = "/mnt/" + $projectRoot.Substring(0,1).ToLower() + $projectRoot.Substring(2).Replace('\','/')
    - wsl -d Ubuntu -u root -- bash -c "service docker status >/dev/null 2>&1 || service docker start"
    - wsl -d Ubuntu -u root -- bash -c "docker rm -f vuuro-ci-dockercheck >/dev/null 2>&1; cd '$wslRoot/scan-service' && docker build -t vuuro-ci-scan-service ."
    - wsl -d Ubuntu -u root -- bash -c "docker run -d --name vuuro-ci-dockercheck -p 18099:8089 vuuro-ci-scan-service"
    - Start-Sleep -Seconds 3
    - wsl -d Ubuntu -u root -- bash -c "curl -sf http://127.0.0.1:18099/health"
    - wsl -d Ubuntu -u root -- bash -c "docker rm -f vuuro-ci-dockercheck"
  rules:
    - changes:
        - scan-service/**/*
        - .gitlab-ci.yml

# Catches exactly the incident Mark found by hand on 2026-08-31: both
# FakeLidarMode.fallback and DebugScanServiceURL's tunnel URL left live
# ("on") on a branch tip after appetize.io testing, twice, only caught
# because Mark happened to re-clone and read the files himself. Git log shows
# this flip-then-reset cycle repeating 7-8 times across this project's
# history - a debug default shipping "on" is a matter of when, not if,
# without something other than manual memory catching it. Cheap and
# deliberately dumb: a plain text match against the one known-safe literal
# for each file. Used to check both app copies so a fix to one didn't leave
# the other silently behind — now just the one tree, since LIDAR-7 folded
# ios-app-with-design/ back into ios-app/ and retired it (2026-09-03, see
# ARCHITECTURE.md's roadmap entry).
#
# Deliberately NOT path-gated on Debug/**, unlike the jobs above: this checks
# a standing invariant on the current HEAD, not "did this diff break
# something." A `changes:` gate here would defeat the whole point - a flag
# flipped on in one commit would go unchecked through every later commit that
# doesn't happen to touch Debug/** again, which is exactly the silent-
# persistence failure mode this exists to catch. Four file reads and a regex
# match costs nothing to run on every pipeline.
debug-flags-safe-defaults:
  stage: test
  tags:
    - windows-shell
  script:
    - |
      $checks = @(
        @{ Path = "ios-app/Sources/Debug/FakeLidarMode.swift"; Pattern = 'private static let fallback = false' },
        @{ Path = "ios-app/Sources/Debug/DebugScanServiceURL.swift"; Pattern = 'private static let fallback: String\? = nil' }
      )
      $failed = $false
      foreach ($check in $checks) {
        $content = Get-Content $check.Path -Raw
        if ($content -notmatch $check.Pattern) {
          Write-Host "FAIL: $($check.Path) is not at its safe default ($($check.Pattern)) - a debug override must never ship live."
          $failed = $true
        } else {
          Write-Host "OK: $($check.Path)"
        }
      }
      if ($failed) { exit 1 }
