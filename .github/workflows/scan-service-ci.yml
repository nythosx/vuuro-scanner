name: Scan Service CI

# Closes the brief's "you own the net under the work... a real independent
# check... whose verdict you cannot merge past" — until this workflow
# existed, net/*.php and tests/*.php were run by hand only, so nothing
# actually blocked a bad backend merge (see scan-service/README.md's
# "Known limits" and ARCHITECTURE.md's roadmap, both now out of date on
# this point). This is the merge gate, running for real.

on:
  push:
    paths:
      - "scan-service/**"
      - ".github/workflows/scan-service-ci.yml"
  pull_request:
    paths:
      - "scan-service/**"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite

      - name: Fast dev-loop unit tests (no server needed)
        working-directory: scan-service
        run: |
          php tests/adapter_test.php
          php tests/repository_test.php
          php tests/export_renderer_test.php
          php tests/concurrency_test.php

      - name: Start the Scan Service (fresh DB)
        working-directory: scan-service
        run: |
          rm -f data/scan_service.sqlite
          php -d post_max_size=16M -d display_errors=0 -S 127.0.0.1:8089 public/index.php &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8089/health > /dev/null && break
            sleep 0.5
          done

      # Chained on purpose, one shared server/DB — see scan-service/README.md
      # for why the order isn't arbitrary (verify_enterprise_hardening.php's
      # rate-limit check must run last).
      - name: The independent net (9-script merge gate)
        working-directory: scan-service
        run: |
          php net/verify_capture_geometry.php http://127.0.0.1:8089
          php net/verify_multiroom_and_attachments.php http://127.0.0.1:8089
          php net/verify_exports.php http://127.0.0.1:8089
          php net/verify_acl.php http://127.0.0.1:8089
          php net/verify_coverage.php http://127.0.0.1:8089
          php net/verify_openings_and_objects.php http://127.0.0.1:8089
          php net/verify_security_fixes.php http://127.0.0.1:8089
          php net/verify_error_messages.php http://127.0.0.1:8089
          php net/verify_enterprise_hardening.php http://127.0.0.1:8089

      # Deliberately its own server/DB on a different port — see this
      # script's own header for why it can't share the suite above (it
      # floods a global-per-IP bucket that would spuriously 429 every
      # other script's session/capture calls sharing 127.0.0.1).
      - name: The standalone post-body-read rate-limit net
        working-directory: scan-service
        run: |
          rm -f data/scan_service.sqlite
          php -d post_max_size=16M -d display_errors=0 -S 127.0.0.1:9499 public/index.php &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:9499/health > /dev/null && break
            sleep 0.5
          done
          php net/verify_post_body_read_rate_limit.php http://127.0.0.1:9499
