name: Scan Service CI

# Closes the brief's "you own the net under the work... a real independent
# check... whose verdict you cannot merge past" — until this workflow
# existed, net/*.php and tests/*.php were run by hand only, so nothing
# actually blocked a bad backend merge (see scan-service/README.md's
# "Known limits" and ARCHITECTURE.md's roadmap, both now out of date on
# this point). This is the merge gate, running for real.

on:
  push:
    paths:
      - "scan-service/**"
      - ".github/workflows/scan-service-ci.yml"
  pull_request:
    paths:
      - "scan-service/**"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite

      - name: Fast dev-loop unit tests (no server needed)
        working-directory: scan-service
        run: |
          php tests/adapter_test.php
          php tests/repository_test.php
          php tests/export_renderer_test.php
          php tests/concurrency_test.php
          php tests/room_split_test.php
          php tests/service_settings_test.php
          php tests/opening_dedup_test.php
          php tests/device_openings_test.php
          php tests/group_placement_test.php
          php tests/group_placement_repository_test.php
          php tests/replace_rooms_merge_test.php
          php tests/render_scenarios_test.php
          php tests/joined_openings_test.php
          php tests/floor_groups_join_test.php

      - name: The independent net (every suite, fresh servers and DBs)
        working-directory: scan-service
        run: php net/run_all.php
