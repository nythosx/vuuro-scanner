services:
  caddy-tls-local:
    image: caddy:2-alpine
    depends_on:
      scan-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./Caddyfile.tls-local:/etc/caddy/Caddyfile:ro
      - caddy_tls_local_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost:8443/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  caddy_tls_local_data:
