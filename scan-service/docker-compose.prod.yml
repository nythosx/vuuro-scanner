# Production overlay — adds Caddy + a real domain on top of the local base.
# Not needed for local dev, and never touched by the README's local steps.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  scan-service:
    ports: !reset []
    env_file: .env
    environment:
      SCAN_SERVICE_ENV: production
      SCAN_SERVICE_APP_KEY: ${SCAN_SERVICE_APP_KEY:?set SCAN_SERVICE_APP_KEY to a random value of at least 24 characters before running}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    depends_on:
      - scan-service
    ports:
      - "80:80"
      - "443:443"
    environment:
      SCAN_SERVICE_DOMAIN: ${SCAN_SERVICE_DOMAIN:?set SCAN_SERVICE_DOMAIN to a real domain pointed at this host before running}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
