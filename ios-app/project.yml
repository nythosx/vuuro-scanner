name: VuuroScan
options:
  bundleIdPrefix: com.vuuro
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  VuuroScan:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Vuuro Scan
        NSCameraUsageDescription: Vuuro Scan uses the camera and LiDAR sensor to capture room geometry for floor plans.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vuuro.scan
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Left blank on purpose: no Apple Developer Team ID is available on this
        # machine. Set DEVELOPMENT_TEAM as a CI secret / local override once one
        # of Mark's or the org's team IDs is on hand — see ios-app/README.md's
        # CI checklist for why this can't be filled in here.
        DEVELOPMENT_TEAM: ""
