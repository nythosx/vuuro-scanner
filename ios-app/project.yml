name: VuuroScan
options:
  bundleIdPrefix: com.vuuro
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  VuuroScan:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources/Fonts
      - path: Resources/Localizable.xcstrings
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Vuuro Scan
        NSCameraUsageDescription: Vuuro Scan uses the camera and LiDAR sensor to capture room geometry for floor plans.
        NSLocationWhenInUseUsageDescription: Vuuro Scan can record the approximate location of a scan so it's attached to the right property. Denying this only skips the location - the scan still works.
        NSLocalNetworkUsageDescription: Vuuro Scan uploads captures to your own Scan Service on this network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ScanServiceBaseURL: $(SCAN_SERVICE_BASE_URL)
        UILaunchScreen: {}
        UIAppFonts:
          - OpenSans-Variable.ttf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleLocalizations:
          - en
          - nl
        CFBundleDevelopmentRegion: en
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vuuro.scan
        TARGETED_DEVICE_FAMILY: "1,2"
        SCAN_SERVICE_BASE_URL: http://127.0.0.1:8089
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
    postbuildScripts:
      - name: Embed Debug build info (commit SHA, build time)
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            GIT_SHA=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || echo "unknown")
            BUILD_TIME=$(date -u +"%Y-%m-%d %H:%M UTC")
            PLIST_PATH="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
            if [ -f "$PLIST_PATH" ]; then
              /usr/libexec/PlistBuddy -c "Add :GitCommitSHA string $GIT_SHA" "$PLIST_PATH" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :GitCommitSHA $GIT_SHA" "$PLIST_PATH"
              /usr/libexec/PlistBuddy -c "Add :BuildTimestamp string $BUILD_TIME" "$PLIST_PATH" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :BuildTimestamp $BUILD_TIME" "$PLIST_PATH"
            fi
          fi
